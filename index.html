function title(slug){return LESSONS[slug]?.title||TITLE_MAP[slug]||slug.replaceAll('-',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function area(id){return AREAS.find(a=>a.id===id)}

function termize(t=''){return t.replace(/\{\{([^|}]+)\|([^}]+)\}\}/g,(_,key,label)=>`${label}<button class="help" data-term="${key}" aria-label="Explicar ${label}">?</button>`)}

function diagnostic(id){const s=SYMPTOMS.find(x=>x.id===id)||SYMPTOMS[0];app().innerHTML=`<section class="page-hero"><div class="shell"><nav class="breadcrumb"><a href="#home">Início</a><span>›</span><a href="#sintomas">Problemas</a><span>›</span><strong>${s.title}</strong></nav><span class="eyebrow">Diagnóstico por sintoma</span><h1>${s.title}</h1><p>${s.summary}</p></div></section><div class="shell diagnostic-layout"><div><div class="diag-intro"><h3>Como investigar este problema</h3><p>Não conclua a causa olhando um indicador isolado. Abaixo estão as hipóteses mais comuns e quais análises ajudam a confirmar ou descartar cada uma.</p></div><div class="diag-tree">${s.causes.map((c,i)=>`<article class="cause"><div class="cause-head"><span class="cause-n">${i+1}</span><div><h3>${c[0]}</h3><p>${c[1]}</p><div class="links">${c[2].map(x=>`<a href="#lesson/${x}">${title(x)}</a>`).join('')}</div></div></div></article>`).join('')}</div></div><aside class="sidebar"><div class="side-card"><span class="eyebrow">Regra de análise</span><h4>Sintoma ≠ causa</h4><p>“Caixa negativo”, “estoque alto” ou “lucro baixo” são sintomas. A análise deve testar hipóteses antes de definir a ação.</p></div><div class="side-card"><span class="eyebrow">Próximo passo</span><p>Abra as análises sugeridas e compare o que cada uma responde. O objetivo é encontrar a causa que melhor explica o comportamento observado.</p></div></aside></div>`}

function panel(id,ey,h,inner){return `<section id="${id}" class="panel"><span class="eyebrow">${ey}</span><h3>${h}</h3>${inner}</section>`}
function paintRole(d,role){const box=document.getElementById('roleContent');if(!box)return;const arr=role==='manager'?d.manager:d.operator;box.innerHTML=`<h4>${role==='manager'?'O que quem analisa precisa fazer':'O que quem alimenta o processo precisa garantir'}</h4><ul>${arr.map(x=>`<li>${termize(x)}</li>`).join('')}</ul>`;document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('on',b.dataset.role===role))}
function route(){const h=location.hash||'#home';if(h.startsWith('#area/'))areaPage(h.split('/')[1]);else if(h.startsWith('#lesson/'))lesson(h.split('/')[1]);else if(h.startsWith('#diagnostico/'))diagnostic(h.split('/')[1]);else home();window.scrollTo(0,0)}
function searchable(){let out=[];AREAS.forEach(a=>a.groups.forEach(g=>g[2].forEach(slug=>out.push({type:'Conteúdo',title:title(slug),sub:a.title,href:`#lesson/${slug}`,text:(LESSONS[slug]?.summary||'')+' '+title(slug)+' '+a.title}))));SYMPTOMS.forEach(s=>out.push({type:'Problema',title:s.title,sub:'Diagnóstico por sintoma',href:`#diagnostico/${s.id}`,text:s.title+' '+s.summary+' '+s.causes.map(c=>c[0]+' '+c[1]).join(' ')}));return out}
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function search(q){const n=normalize(q.trim());const words=n.split(/\s+/).filter(Boolean);let arr=searchable();if(words.length)arr=arr.map(x=>({x,score:words.reduce((s,w)=>s+(normalize(x.text).includes(w)?1:0),0)})).filter(o=>o.score>0).sort((a,b)=>b.score-a.score).map(o=>o.x);document.getElementById('searchResults').innerHTML=arr.slice(0,24).map(x=>`<a class="result" href="${x.href}"><span class="rtype">${x.type}</span><strong>${x.title}</strong><small>${x.sub}</small></a>`).join('')||'<div class="result"><strong>Nenhum resultado encontrado.</strong><small>Tente descrever o problema com outras palavras.</small></div>'}
function openSearch(q=''){document.getElementById('searchOverlay').classList.add('open');document.getElementById('searchInput').value=q;search(q);setTimeout(()=>document.getElementById('searchInput').focus(),50)}
function closeSearch(){document.getElementById('searchOverlay').classList.remove('open')}
function showTerm(btn){const key=btn.dataset.term,g=GLOSSARY[key];if(!g)return;const pop=document.getElementById('termPop');pop.innerHTML=`<strong>${g.t}</strong><p>${g.d}</p><a href="#lesson/${g.link}">Entender o tema completo →</a>`;pop.classList.remove('hidden');const r=btn.getBoundingClientRect(),w=Math.min(320,window.innerWidth-24);let left=Math.min(r.left,window.innerWidth-w-12),top=r.bottom+8;if(top+160>window.innerHeight)top=Math.max(12,r.top-150);pop.style.width=w+'px';pop.style.left=Math.max(12,left)+'px';pop.style.top=top+'px'}
window.addEventListener('hashchange',()=>{closeSearch();route()});document.addEventListener('click',e=>{const j=e.target.closest('[data-jump]');if(j){e.preventDefault();document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'})}const r=e.target.closest('[data-role]');if(r){const d=LESSONS[(location.hash||'').split('/')[1]];if(d)paintRole(d,r.dataset.role)}const t=e.target.closest('[data-term]');if(t){e.preventDefault();e.stopPropagation();showTerm(t)}else if(!e.target.closest('#termPop'))document.getElementById('termPop').classList.add('hidden')});
document.getElementById('openSearch').onclick=()=>openSearch('');document.getElementById('closeSearch').onclick=closeSearch;document.getElementById('doSearch').onclick=()=>search(document.getElementById('searchInput').value);document.getElementById('searchInput').addEventListener('input',e=>search(e.target.value));document.getElementById('searchOverlay').addEventListener('click',e=>{if(e.target.id==='searchOverlay')closeSearch()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();document.getElementById('termPop').classList.add('hidden')}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();openSearch('')}});route();
</script>
</body></html>
