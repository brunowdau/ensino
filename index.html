<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#345574">
  <meta name="description" content="Ensino Lean — capacitação e apoio à gestão para clientes Lean Company.">
  <title>Ensino Lean | Lean Company</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <header class="header">
    <div class="shell header-inner">
      <a class="brand" href="#home" aria-label="Ensino Lean — Início">
        <span class="brand-wordmark">LEAN <b>COMPANY</b></span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-label">ENSINO</span>
      </a>
      <nav class="nav" aria-label="Navegação principal">
        <a href="#home">Início</a>
        <a href="#financeiro">Financeiro</a>
        <a href="#diagnostico/caixa-ruim">Resolver um problema</a>
        <button id="openSearch" class="nav-search" type="button">Buscar <span aria-hidden="true">/</span></button>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="shell footer-inner">
      <span class="brand-wordmark footer-wordmark">LEAN <b>COMPANY</b></span>
      <p>Ensino Lean · aprender, executar e analisar melhor</p>
    </div>
  </footer>

  <div id="searchOverlay" class="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
      <div class="modal-head">
        <div>
          <span class="eyebrow">Busca</span>
          <h2 id="searchTitle">O que você quer entender?</h2>
          <p>Você pode buscar um termo ou escrever a dúvida como ela aparece no dia a dia.</p>
        </div>
        <button id="closeSearch" class="close" type="button" aria-label="Fechar busca">×</button>
      </div>
      <form id="searchForm" class="searchbar searchbar-modal" role="search">
        <label class="sr-only" for="searchInput">Buscar no Ensino Lean</label>
        <input id="searchInput" placeholder="Ex.: conta de março paga em abril; lucro mas falta caixa; DRE">
        <button class="btn primary" type="submit">Buscar</button>
      </form>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <div id="termPopover" class="term-popover hidden" role="dialog" aria-live="polite"></div>

  <script src="data/content.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
